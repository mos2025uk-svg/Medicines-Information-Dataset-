name: TCF Vancouver monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay a few minutes)
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write             # to commit tcf-monitor/state.json

concurrency:
  group: tcf-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tcf-monitor/requirements.txt

      - run: pip install -r tcf-monitor/requirements.txt

      - name: Check centres
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tcf-monitor/monitor.py

      - name: Save state
        run: |
          git config user.name "tcf-monitor-bot"
          git config user.email "tcf-monitor-bot@users.noreply.github.com"
          git add tcf-monitor/state.json
          git diff --cached --quiet || (git commit -m "tcf-monitor: update state [skip ci]" && git push)
